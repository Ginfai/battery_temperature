<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电池温度监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/echarts.min.js"></script>
</head>
<body>
<header>
  <h1>电池温度监控</h1>
  <div class="controls">
    <label for="record-interval" title="录制时数据落盘的行间隔秒数;实时画面不受影响">录制间隔
      <select id="record-interval">
        <option value="1">1s</option>
        <option value="10" selected>10s</option>
        <option value="30">30s</option>
        <option value="60">1min</option>
      </select>
    </label>
    <button id="btn-record" class="primary">● 开始录制</button>
    <button id="btn-android-config">Android 设备配置</button>
    <span id="record-status"></span>
  </div>
</header>

<main>
  <section id="devices" class="device-grid">
    <p id="no-device" class="hint">等待设备连接…（请用 USB 线连接 iPhone）</p>
  </section>

  <section id="chart-section">
    <h2>温度曲线（约 5 分钟窗口）</h2>
    <div id="chart"></div>
  </section>

  <section id="exports-section" hidden>
    <h2>录制会话</h2>
    <ul id="exports-list"></ul>
  </section>
</main>

<!-- Android 设备接入配置弹窗 -->
<div id="android-config-modal" class="modal" style="display:none">
  <div class="modal-box">
    <h3>Android 设备接入配置</h3>
    <div id="android-config-body" class="config-body">加载中...</div>
    <div class="modal-actions">
      <button id="android-config-close">关闭</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
